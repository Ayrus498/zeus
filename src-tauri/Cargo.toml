[package]
name = "zeus"
version = "0.1.0"
description = "ZEUS - local AI coding desktop application powered by Ollama"
edition = "2021"
license = "MIT"

[lib]
name = "zeus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
